# Rebuilds the game and republishes it to GitHub Pages on every push to main.
#
# It deploys the single self-contained file `npm run release` produces, renamed to
# index.html, rather than the ordinary dist/ output. That file inlines every image as
# base64 and carries no external asset paths at all, which sidesteps the usual project-
# pages headache of having to set Vite's `base` to the repo subpath.
name: Deploy game to Pages

on:
  push:
    branches: [main]
  # lets you redeploy by hand from the Actions tab without pushing anything
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a run already in flight is left to finish, but queued ones collapse to the newest
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the self-contained game
        run: npm run release

      - name: Stage it as the site index
        run: |
          mkdir -p _site
          cp moralyn-standalone.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
